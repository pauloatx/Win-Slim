name: WinSlim Windows candidate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: winslim-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.12'
          architecture: x64
      - name: Initialize current-run evidence
        run: |
          $ciEvidence = Join-Path $env:RUNNER_TEMP ('winslim-ci-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          ('CI_EVIDENCE=' + $ciEvidence) | Add-Content -Encoding UTF8 $env:GITHUB_ENV
          python tools/ci_evidence.py start --root . --output "$ciEvidence"
          exit $LASTEXITCODE
      - name: Record Windows dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          Add-Type -AssemblyName PresentationFramework
          [ordered]@{
            PowerShell = $PSVersionTable.PSVersion.ToString()
            Process64Bit = [Environment]::Is64BitProcess
            OS = [Environment]::OSVersion.VersionString
            FrameworkRelease = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full').Release
            Compiler = $compiler
            CompilerVersion = (Get-Item $compiler).VersionInfo.FileVersion
            CompilerSHA256 = (Get-FileHash $compiler -Algorithm SHA256).Hash
            WPF = [Windows.Window].Assembly.FullName
            WPFLocation = [Windows.Window].Assembly.Location
            Git = (git --version)
          } | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $env:CI_EVIDENCE 'dependencies.json')
          if ($PSVersionTable.PSVersion.Major -ne 5 -or -not [Environment]::Is64BitProcess) {
            throw 'The official pipeline requires Windows PowerShell 5.1 x64.'
          }
      - name: Validate registered cases and delivered hashes without packaging
        run: |
          python tools/package_release.py . specs/FASE7-R3.2.84-baseline.json
          exit $LASTEXITCODE
      - name: Run official candidate pipeline (build, WPF and current registry)
        id: candidate
        run: |
          & .\Iniciar-Validacao.bat /ci
          exit $LASTEXITCODE
      - name: Collect hosted WPF and bridge evidence
        if: always()
        run: |
          $ErrorActionPreference = 'Continue'
          $diag = Join-Path $env:CI_EVIDENCE 'hosted-diagnostics'
          New-Item -ItemType Directory -Path $diag -Force | Out-Null
          $root = (Resolve-Path '.').Path
          $envInfo = [ordered]@{
            Culture = [System.Globalization.CultureInfo]::CurrentCulture.Name
            UICulture = [System.Globalization.CultureInfo]::CurrentUICulture.Name
            DefaultCodePage = [System.Text.Encoding]::Default.CodePage
            ConsoleOutputCodePage = [Console]::OutputEncoding.CodePage
            PowerShell = $PSVersionTable.PSVersion.ToString()
            PowerShellEdition = $PSVersionTable.PSEdition
            Process64Bit = [Environment]::Is64BitProcess
            Temp = $env:TEMP
          }
          try {
            Add-Type -AssemblyName System.Windows.Forms
            $envInfo['Screens'] = @([System.Windows.Forms.Screen]::AllScreens | ForEach-Object {
              [ordered]@{ Device = $_.DeviceName; Bounds = $_.Bounds.ToString(); WorkingArea = $_.WorkingArea.ToString(); Primary = $_.Primary } })
          } catch { $envInfo['Screens'] = $_.Exception.Message }
          $envInfo | ConvertTo-Json -Depth 6 | Set-Content -Encoding UTF8 (Join-Path $diag 'environment.json')
          try {
            Add-Type -TypeDefinition @'
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          public static class WinSlimDisplayProbe {
            [StructLayout(LayoutKind.Sequential, CharSet=CharSet.Ansi)]
            public struct DEVMODE {
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst=32)] public string dmDeviceName;
              public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra;
              public int dmFields, dmPositionX, dmPositionY, dmDisplayOrientation, dmDisplayFixedOutput;
              public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst=32)] public string dmFormName;
              public short dmLogPixels;
              public int dmBitsPerPel, dmPelsWidth, dmPelsHeight, dmDisplayFlags, dmDisplayFrequency;
              public int dmICMMethod, dmICMIntent, dmMediaType, dmDitherType, dmReserved1, dmReserved2, dmPanningWidth, dmPanningHeight;
            }
            [DllImport("user32.dll", CharSet=CharSet.Ansi)] public static extern bool EnumDisplaySettings(string device, int mode, ref DEVMODE dm);
            public static List<string> Modes() {
              List<string> modes = new List<string>();
              DEVMODE dm = new DEVMODE();
              dm.dmSize = (short)Marshal.SizeOf(typeof(DEVMODE));
              for (int i = 0; i < 512; i++) {
                if (!EnumDisplaySettings(null, i, ref dm)) break;
                modes.Add(dm.dmPelsWidth + "x" + dm.dmPelsHeight + "@" + dm.dmBitsPerPel + "/" + dm.dmDisplayFrequency);
              }
              return modes;
            }
          }
          '@
            $envInfo['DisplayModes'] = @([WinSlimDisplayProbe]::Modes())
          } catch { $envInfo['DisplayModes'] = $_.Exception.Message }
          $envInfo | ConvertTo-Json -Depth 6 | Set-Content -Encoding UTF8 (Join-Path $diag 'environment.json')
          try {
            Add-Type -AssemblyName PresentationFramework
            Add-Type -AssemblyName PresentationCore
            $probe = New-Object System.Windows.Window
            $probe.WindowStyle = [System.Windows.WindowStyle]::None
            $probe.ResizeMode = [System.Windows.ResizeMode]::CanResize
            $probe.AllowsTransparency = $false
            $probe.WindowStartupLocation = [System.Windows.WindowStartupLocation]::CenterScreen
            $probe.MinWidth = 1040
            $probe.MinHeight = 680
            $probe.Width = 1180
            $probe.Height = 760
            $stages = [ordered]@{}
            $stages['afterSet'] = [string]$probe.Width + 'x' + [string]$probe.Height
            $probe.Content = New-Object System.Windows.Controls.UserControl
            $probe.Content.Measure([System.Windows.Size]::new(1178, 758))
            $probe.Content.Arrange([System.Windows.Rect]::new(0, 0, 1178, 758))
            $probe.Content.UpdateLayout()
            $stages['afterContentLayout'] = [string]$probe.Width + 'x' + [string]$probe.Height
            $probe.Show()
            $probe.UpdateLayout()
            $stages['afterShow'] = [string]$probe.Width + 'x' + [string]$probe.Height
            $stages['actualAfterShow'] = [string]$probe.ActualWidth + 'x' + [string]$probe.ActualHeight
            $probe.Close()
            $stages | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $diag 'window-probe.json')
          } catch { $_.Exception.Message | Set-Content -Encoding UTF8 (Join-Path $diag 'window-probe.error.txt') }
          try {
            $catalog = Get-Content -LiteralPath 'catalog.json' -Raw -Encoding UTF8 | ConvertFrom-Json
            $items = if ($catalog.PSObject.Properties.Name -contains 'tweaks') { @($catalog.tweaks) } else { @($catalog) }
            @($items | Where-Object { $_.id -in @('PERF-001', 'PERF-004') }) |
              ConvertTo-Json -Depth 6 | Set-Content -Encoding UTF8 (Join-Path $diag 'catalog-entries.json')
          } catch { $_.Exception.Message | Set-Content -Encoding UTF8 (Join-Path $diag 'catalog-entries.error.txt') }
          $bridge = Join-Path $root 'src\UI\Native\R3_2_84\WinSlim.UiBridge.ps1'
          foreach ($tweakId in @('PERF-001', 'PERF-004')) {
            $request = [pscustomobject]@{ id = 'diag-' + $tweakId; action = 'tweakDetails'; tweakId = $tweakId } | ConvertTo-Json -Compress
            $response = $request | & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $bridge -Server -RootPath $root 2>&1
            $response | Set-Content -Encoding UTF8 (Join-Path $diag ('bridge-' + $tweakId + '.json'))
          }
          $exe = Join-Path $root 'bin\WinSlim.UI.Native.R3.2.84.exe'
          if (Test-Path -LiteralPath $exe) {
            $self = Join-Path $diag 'selftest.json'
            $process = Start-Process -FilePath $exe -ArgumentList @('--root', $root, '--self-test', $self) -WorkingDirectory $root -Wait -PassThru -RedirectStandardOutput (Join-Path $diag 'selftest.stdout.log') -RedirectStandardError (Join-Path $diag 'selftest.stderr.log')
            [ordered]@{ ExitCode = $process.ExitCode; ResultExists = (Test-Path -LiteralPath $self) } | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $diag 'selftest-exit.json')
            foreach ($name in @('ui-native-r3.2.84.log', 'selftest-r3.2.84.log', 'selftest-custom-r3.2.84.log')) {
              $source = Join-Path $root ('logs\' + $name)
              if (Test-Path -LiteralPath $source) { Copy-Item -LiteralPath $source -Destination (Join-Path $diag $name) -Force }
            }
          }
          exit 0
      - name: Collect current-run text evidence and integrity
        if: always()
        env:
          CI_GATE_OUTCOME: ${{ steps.candidate.outcome }}
        run: |
          $ciEvidence = Join-Path $env:RUNNER_TEMP ('winslim-ci-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          python tools/ci_evidence.py collect --root . --output "$ciEvidence" --outcome "$env:CI_GATE_OUTCOME"
          exit $LASTEXITCODE
      - name: Preserve evidence (no distribution binaries or archives)
        if: always()
        id: evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: WinSlim-CI-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/winslim-ci-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 14
          if-no-files-found: error
      - name: Record artifact receipt
        if: always()
        env:
          CI_GATE_OUTCOME: ${{ steps.candidate.outcome }}
          CI_ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          CI_ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          CI_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: |
          @(
            'Official gate outcome: ' + $env:CI_GATE_OUTCOME
            'Evidence URL: ' + $env:CI_ARTIFACT_URL
            'Artifact ID: ' + $env:CI_ARTIFACT_ID
            'Artifact SHA-256: ' + $env:CI_ARTIFACT_DIGEST
            'Physical/interactive/VM acceptance: not performed by this workflow.'
            'Distribution/publication/production: pending; no distribution package created.'
          ) | Add-Content -Encoding UTF8 $env:GITHUB_STEP_SUMMARY
