<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="vaneGradient" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9611C"/>
      <stop offset="50%" stop-color="#FF8C42"/>
      <stop offset="100%" stop-color="#FFD9A1"/>
    </linearGradient>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E222B"/>
      <stop offset="100%" stop-color="#12141A"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- fundo -->
  <rect width="64" height="64" rx="16" fill="url(#bgGradient)"/>

  <g filter="url(#softShadow)">
    <!-- corpo da pena (vane) -->
    <path d="M14,56 C10,46 12,34 20,24 C26,17 34,12 50,8
             C40,14 26,24 20,34 C14,42 12,50 14,56 Z"
          fill="url(#vaneGradient)" stroke="#8C4A14" stroke-width="1.1" stroke-linejoin="round"/>

    <!-- brilho sutil na borda superior -->
    <path d="M20,24 C26,17 34,12 50,8" fill="none" stroke="#FFEEDC" stroke-width="0.8" stroke-linecap="round" opacity="0.55"/>

    <!-- haste central (rachis) -->
    <path d="M14,56 C16,46 20,34 26,26 C32,20 40,14 50,8"
          fill="none" stroke="#FFF1DE" stroke-width="1.3" stroke-linecap="round" opacity="0.9"/>

    <!-- barbas -->
    <path d="M16,52 L13.6,50.2 M16,52 L18.4,53.6
             M18,47 L14,44 M18,47 L22,49.5
             M20,42 L14.4,37.8 M20,42 L25.4,45.6
             M22,37 L15.6,32.2 M22,37 L28.2,41.2
             M25,32 L17.8,26.6 M25,32 L32,36.8
             M29,27 L22.6,22.2 M29,27 L35.2,31.2
             M33,22 L28.2,18.4 M33,22 L37.6,25
             M38,18 L34.8,15.6 M38,18 L41,20
             M44,13 L42.4,11.8 M44,13 L45.4,14"
          fill="none" stroke="#8C4A14" stroke-width="0.9" stroke-linecap="round" opacity="0.8"/>

    <!-- ponta da pluma (quill) -->
    <path d="M14,56 L11,60" stroke="#8C4A14" stroke-width="1.3" stroke-linecap="round"/>
  </g>
</svg>
